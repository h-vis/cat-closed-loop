<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Closed Loop Puzzle Prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="game-panel">
      <header class="panel-header">
        <p class="eyebrow">Canvas Puzzle Prototype</p>
        <h1>Closed Loop</h1>
        <p class="subtitle">
          ループで空間を切り分け、鍵とゴールを安全に回収するパズルです。
        </p>
      </header>

      <canvas
        id="gameCanvas"
        width="480"
        height="480"
        aria-label="Closed Loop puzzle game canvas"
      ></canvas>

      <section class="hud" aria-label="ゲーム情報">
        <div class="button-row mode-row" aria-label="ゲームモード">
          <button id="randomModeButton" class="is-active" type="button" hidden>ランダムモード</button>
          <button id="tutorialModeButton" type="button">チュートリアル</button>
          <button id="makerModeButton" type="button">ステージメーカー</button>
        </div>

        <section class="stage-loader" aria-label="ステージ選択">
          <div class="stage-loader-row">
            <label class="stage-field" for="stageDifficultySelect">
              難易度
              <select id="stageDifficultySelect">
                <option value="low">低</option>
                <option value="medium">中</option>
                <option value="high">高</option>
              </select>
            </label>
            <label class="stage-field" for="stageNumberInput">
              ステージ番号
              <input id="stageNumberInput" type="number" min="1" step="1" value="1">
            </label>
            <button id="loadStageButton" type="button">番号でプレイ</button>
            <button id="chooseStageFolderButton" type="button">JSONを選ぶ</button>
            <input
              id="stageFolderInput"
              type="file"
              accept=".json,application/json"
              multiple
              hidden
            >
          </div>
          <p id="stageLoaderStatus" class="status-text">
            難易度と番号を選んでステージを読み込めます。ローカルで直接開いた場合は JSON を選んでください。
          </p>
        </section>

        <p id="instructionText" class="instructions">
          マウスドラッグでマスを塗ってループを作ります。ループや分断された外側の空間にあるオブジェクトが相互作用します。
        </p>

        <div class="status-grid">
          <p><span class="label">鍵</span><span id="keyStatus">未取得</span></p>
          <p><span class="label">爆弾</span><span id="bombStatus">0個</span></p>
          <p><span class="label">水入りバケツ</span><span id="disarmStatus">0個</span></p>
          <p><span class="label">状態</span><span id="stateStatus">待機中</span></p>
        </div>

        <div class="button-row">
          <button id="resetButton" type="button">リセット</button>
          <button id="clearLoopButton" type="button">ループを消す</button>
        </div>

        <div id="tutorialButtonRow" class="button-row tutorial-row" hidden>
          <button id="tutorialPrevButton" type="button">前のステージ</button>
          <button id="tutorialNextButton" type="button">次のステージ</button>
        </div>

        <section id="makerPanel" class="maker-panel" hidden aria-label="ステージメーカー設定">
          <div class="maker-size-row">
            <label class="maker-field" for="makerWidthInput">
              幅
              <input id="makerWidthInput" type="number" min="6" max="14" value="10">
            </label>
            <label class="maker-field" for="makerHeightInput">
              高さ
              <input id="makerHeightInput" type="number" min="6" max="14" value="10">
            </label>
            <button id="makerApplySizeButton" type="button">サイズを適用</button>
            <button id="makerResetButton" type="button">配置を初期化</button>
          </div>

          <div class="maker-palette" aria-label="配置ツール">
            <button id="makerToolPlayer" class="maker-tool is-active" type="button">プレイヤー</button>
            <button id="makerToolKey" class="maker-tool" type="button">鍵</button>
            <button id="makerToolGoal" class="maker-tool" type="button">ゴール</button>
            <button id="makerToolBomb" class="maker-tool" type="button">爆弾</button>
            <button id="makerToolDisarm" class="maker-tool" type="button">水入りバケツ</button>
            <button id="makerToolWall" class="maker-tool" type="button">壁ブロック</button>
            <button id="makerToolErase" class="maker-tool" type="button">消しゴム</button>
          </div>

          <div class="button-row maker-action-row">
            <button id="makerTestButton" type="button">テストプレイ開始</button>
            <button id="makerEditButton" type="button" hidden>編集に戻る</button>
            <button id="makerAutoSolveButton" type="button">自動で解く</button>
          </div>
          <p id="makerSolveStatus" class="status-text"></p>

          <div class="maker-export-row">
            <label class="maker-field" for="makerExportNumberInput">
              JSON番号
              <input id="makerExportNumberInput" type="number" min="1" step="1" value="1">
            </label>
            <button id="makerExportJsonButton" type="button">JSON出力</button>
          </div>
          <p id="makerExportStatus" class="status-text"></p>
          <textarea
            id="makerJsonOutput"
            class="maker-json-output"
            readonly
            placeholder="ここにステージ JSON が表示されます。"
          ></textarea>

          <p id="makerHint" class="maker-hint"></p>
        </section>

        <p id="stageInfo" class="stage-info"></p>
      </section>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
