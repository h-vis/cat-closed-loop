plugins {
    id "com.android.application"
}

def signingPropertiesFile = rootProject.file("signing.properties")
def signingProperties = new Properties()
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace "com.hvis.closedloopdungeon"
    compileSdk 36

    defaultConfig {
        applicationId "com.hvis.closedloopdungeon"
        minSdk 23
        targetSdk 36
        versionCode 10
        versionName "0.1.9"
    }

    signingConfigs {
        release {
            if (signingPropertiesFile.exists()) {
                storeFile rootProject.file(signingProperties["storeFile"])
                storePassword signingProperties["storePassword"]
                keyAlias signingProperties["keyAlias"]
                keyPassword signingProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            if (signingPropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    def billing_version = "9.1.0"
    implementation "com.android.billingclient:billing:$billing_version"
}

configurations.configureEach {
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
}

tasks.register("syncWebAssets", Copy) {
    def root = layout.projectDirectory.dir("../..")
    from(root) {
        include "index.html"
        include "howto.html"
        include "game.js"
        include "spotlight-tutorial.js"
        include "style.css"
        include "sozai/**"
        include "stage/**"
        include "tutorial/**"
    }
    into(layout.projectDirectory.dir("src/main/assets"))
}

preBuild.dependsOn("syncWebAssets")
